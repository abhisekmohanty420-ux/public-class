<!DOCTYPEhtml>
<html>
<head>
    <title>Event Capturing and Bubbling</title>

    <style>
         #grandparent {
             padding: 50px;
             background-color:lightblue;
            }  

         #parent {
            padding: 40px;
             background-color: lightgreen;
             }

         #child {
            padding: 20px;
            background-color: orange;
         } 
             #grandparent1 {
             padding: 50px;
             background-color:lightblue;
            }  

         #parent2 {
            padding: 40px;
             background-color: lightgreen;
             }

         #child3 {
            padding: 20px;
            background-color: orange;
         } 
    </style>
</head>

<body>
 <div id="grandparent">
        Grandparent

        <div id="parent">
            Parent

            <button id="child">
                Click Me
            </button>

        </div>
    </div>
     <div id="grandparent1">
        Grandparent

        <div id="parent2">
            Parent

            <button id="child3">
                Click Me
            </button>

        </div>
    </div>


    <script>

        let grandparent = document.getElementById("grandparent");
        let parent = document.getElementById("parent");
        let child = document.getElementById("child");
        let grandparent1 = document.getElementById("grandparent1");
        let parent2 = document.getElementById("parent2");
        let child3 = document.getElementById("child3")
        grandparent.addEventListener("click", function () {
            console.log("Grandparent - Capturing")
        }, true);
        parent.addEventListener("click", function () {
            console.log("Parent - Capturing")
        }, true);
        child.addEventListener("click", function () {
            console.log("Child")
        }, true);
        grandparent1.addEventListener("click", function () {
            console.log("Grandparent - Bubbling")
        });
        parent2.addEventListener("click", function () {
            console.log("Parent - Bubbling")
        });
        child3.addEventListener("click", function () {
            console.log("Child - Bubbling")
        });

    </script>

</body>
</html>
